name: Validate dotfiles

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    uses: ./.github/workflows/mise-lock.yaml
    permissions:
      contents: write
      pull-requests: write
      actions: write

  validate:
    name: Validate (${{ matrix.os }})
    needs: refresh
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.refresh.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Install validation tools on the disposable runner
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y zsh shellcheck
          else
            brew install shellcheck
          fi
          curl -fsSL https://get.chezmoi.io | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/validate.py

  required:
    name: Required CI
    if: always()
    needs: [refresh, validate]
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          REFRESH: ${{ needs.refresh.result }}
          RESULT: ${{ needs.validate.result }}
        run: test "$REFRESH" = success && test "$RESULT" = success
      - name: Publish the result on the exact validated commit
        if: >-
          always() &&
          (!github.event.pull_request ||
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.refresh.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          REFRESH: ${{ needs.refresh.result }}
          RESULT: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$REFRESH" == success && "$RESULT" == success ]]; then
            state=success
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
            -f "state=$state" -f 'context=Dotfiles CI' \
            -f 'description=macOS and Linux dotfiles validation' \
            -f "target_url=$RUN_URL"
