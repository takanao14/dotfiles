name: Validate dotfiles

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    uses: ./.github/workflows/mise-lock.yaml
    permissions:
      contents: write
      pull-requests: write
      actions: write

  scope:
    name: Select validation OSes
    # Run beside refresh: its generated commit only touches Linux-only paths,
    # so it cannot change the selection.
    runs-on: ubuntu-26.04
    outputs:
      os: ${{ steps.select.outputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip macOS when only Linux-only paths changed
        id: select
        run: echo "os=$(bash scripts/select_validate_os.sh origin/main HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate (${{ matrix.os }})
    needs: [refresh, scope]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.refresh.outputs.sha }}
          persist-credentials: false
      # Use the runner's python3 like the managed machines do; setup-python
      # downloads uncached versions on macOS and dominated the job time.
      - name: Require a python3 with tomllib
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "python3 >= 3.11 is required"'
      - name: Install validation tools on the disposable runner
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            if ! command -v zsh >/dev/null || ! command -v shellcheck >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y zsh shellcheck
            fi
          elif ! command -v shellcheck >/dev/null; then
            brew install shellcheck
          fi
          curl -fsSL https://get.chezmoi.io | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/validate.py

  install:
    name: Locked Linux install (${{ matrix.os }})
    needs: refresh
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.refresh.outputs.sha }}
          persist-credentials: false
      - name: Install prerequisites on the disposable runner
        shell: bash
        run: |
          missing=()
          for tool in curl git gzip tar unzip xz python3; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          test -e /etc/ssl/certs/ca-certificates.crt || missing+=(ca-certificates)
          if (( ${#missing[@]} )); then
            echo "Installing prerequisites for: ${missing[*]}"
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl git gzip tar unzip xz-utils python3
          fi
      - name: Validate Linux lock coverage
        run: python3 scripts/validate_mise_lock.py
      - name: Install the repository-pinned mise
        run: bash scripts/install_mise_ci.sh "$RUNNER_TEMP/mise"
      - name: Install every configured tool from an empty data directory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CONFIG_FILE: ${{ github.workspace }}/dot_config/mise/config.toml
          MISE_DATA_DIR: ${{ runner.temp }}/mise-data
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
          MISE_SAFE: "1"
          UV_EXCLUDE_NEWER: "2 days"
        shell: bash
        run: |
          set -euo pipefail
          # Do not restore installed tools: a cache hit could hide a broken lock.
          test ! -e "$MISE_DATA_DIR"
          test ! -e "$MISE_CACHE_DIR"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mise" install --yes --locked
          "$RUNNER_TEMP/mise" exec -- btm --version
          "$RUNNER_TEMP/mise" exec -- k9s version
      - name: Require the locked install to leave generated data unchanged
        run: git diff --exit-code -- dot_config/mise

  required:
    name: Required CI
    if: always()
    needs: [refresh, scope, validate, install]
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-26.04
    steps:
      - name: Require every validation job to succeed
        env:
          REFRESH: ${{ needs.refresh.result }}
          RESULT: ${{ needs.validate.result }}
          INSTALL: ${{ needs.install.result }}
          SCOPE: ${{ needs.scope.result }}
        run: >-
          test "$REFRESH" = success && test "$SCOPE" = success &&
          test "$RESULT" = success && test "$INSTALL" = success
      - name: Publish the result on the exact validated commit
        if: >-
          always() &&
          (!github.event.pull_request ||
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.refresh.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          REFRESH: ${{ needs.refresh.result }}
          RESULT: ${{ needs.validate.result }}
          INSTALL: ${{ needs.install.result }}
          SCOPE: ${{ needs.scope.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$REFRESH" == success && "$SCOPE" == success &&
                "$RESULT" == success && "$INSTALL" == success ]]; then
            state=success
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
            -f "state=$state" -f 'context=Dotfiles CI' \
            -f 'description=macOS and Linux dotfiles validation' \
            -f "target_url=$RUN_URL"
