name: Publish validation status

on:
  workflow_run:
    workflows: [Validate dotfiles]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    # Fork validations cannot write commit statuses. Publish only their result
    # from main; same-repository and dispatched runs publish their own status.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository &&
      github.event.workflow_run.conclusion != 'action_required'
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute code/artifacts from the triggering PR.
      - name: Publish the result on the triggering commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$CONCLUSION" == success ]]; then
            state=success
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
            -f "state=$state" -f 'context=Dotfiles CI' \
            -f 'description=macOS and Linux dotfiles validation' \
            -f "target_url=$RUN_URL"
