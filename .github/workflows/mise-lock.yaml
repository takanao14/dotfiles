name: Refresh mise lockfile

on:
  workflow_call:
    inputs:
      manual:
        type: boolean
        default: false
    outputs:
      sha:
        description: Commit to validate after refreshing generated data
        value: ${{ jobs.refresh.outputs.sha }}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - name: Check out the update branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Select the update branch and detect relevant changes
        id: select
        env:
          MANUAL: ${{ inputs.manual }}
          SAME_REPO: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          branch="$HEAD_BRANCH"
          refresh=false
          if [[ "$MANUAL" == true ]]; then
            branch="codex/mise-lock-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            refresh=true
          elif [[ "$SAME_REPO" == true && "$branch" != main ]]; then
            # Dispatches must also refresh relevant changes, including a branch
            # update that races with the preceding generated push.
            if [[ -z "$BASE_SHA" ]]; then
              BASE_SHA="$(git rev-parse origin/main)"
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              dot_config/mise/config.toml \
              .chezmoiscripts/run_onchange_after_40_linux_mise.sh.tmpl; then
              refresh=true
            fi
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"

      - name: Refresh the repository-pinned mise checksums
        if: steps.select.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          installer=.chezmoiscripts/run_onchange_after_40_linux_mise.sh.tmpl
          # Match the literal shell parameter expansion.
          # shellcheck disable=SC2016
          version="$(sed -n 's/^readonly MISE_VERSION="${MISE_VERSION:-\([^}]*\)}"$/\1/p' "$installer")"
          checksums="$(curl --compressed -fsSL \
            "https://github.com/jdx/mise/releases/download/v${version}/SHASUMS256.txt")"
          x64_checksum="$(awk -v name="./mise-v${version}-linux-x64" \
            '$2 == name { print $1 }' <<<"$checksums")"
          arm64_checksum="$(awk -v name="./mise-v${version}-linux-arm64" \
            '$2 == name { print $1 }' <<<"$checksums")"
          [[ "$x64_checksum" =~ ^[0-9a-f]{64}$ ]]
          [[ "$arm64_checksum" =~ ^[0-9a-f]{64}$ ]]
          sed -i \
            "/x86_64)/,/;;/ s/readonly MISE_SHA256=\"[0-9a-f]*\"/readonly MISE_SHA256=\"${x64_checksum}\"/" \
            "$installer"
          sed -i \
            "/aarch64 | arm64)/,/;;/ s/readonly MISE_SHA256=\"[0-9a-f]*\"/readonly MISE_SHA256=\"${arm64_checksum}\"/" \
            "$installer"

      - name: Install the repository-pinned mise
        if: steps.select.outputs.refresh == 'true'
        run: bash scripts/install_mise_ci.sh "$RUNNER_TEMP/mise"

      - name: Refresh the Linux lock entries
        if: steps.select.outputs.refresh == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CONFIG_FILE: ${{ github.workspace }}/dot_config/mise/config.toml
          MISE_SAFE: "1"
        run: >-
          "$RUNNER_TEMP/mise" lock --global --bump
          --platform linux-x64,linux-arm64

      - name: Verify every configured tool remains locked
        if: steps.select.outputs.refresh == 'true'
        run: python3 scripts/validate_mise_lock.py

      - name: Commit the refreshed mise data
        id: commit
        if: steps.select.outputs.refresh == 'true'
        shell: bash
        env:
          UPDATE_BRANCH: ${{ steps.select.outputs.branch }}
        run: |
          set -euo pipefail
          installer=.chezmoiscripts/run_onchange_after_40_linux_mise.sh.tmpl
          lockfile=dot_config/mise/mise.lock
          if git diff --quiet -- "$installer" "$lockfile"; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$installer" "$lockfile"
          git commit -m "chore: refresh mise generated data"
          # Normal push rejects a concurrent branch update instead of overwriting it.
          test "$UPDATE_BRANCH" != main
          git push origin "HEAD:$UPDATE_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open the manual update PR
        if: inputs.manual && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.select.outputs.branch }}
        run: >-
          gh pr create --base main --head "$UPDATE_BRANCH"
          --title "chore: refresh mise generated data"
          --body "Refresh the pinned mise checksums and Linux lockfile."

      - name: Validate the generated commit explicitly
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.select.outputs.branch }}
        run: gh workflow run validate.yaml --ref "$UPDATE_BRANCH"

      - name: Record the exact commit to validate
        id: result
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
