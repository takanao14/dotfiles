name: Refresh mise lockfile

on:
  pull_request:
    paths:
      - dot_config/mise/config.toml
      - .chezmoiscripts/run_onchange_after_40_linux_mise.sh.tmpl
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the update branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Refresh the repository-pinned mise checksums
        shell: bash
        run: |
          set -euo pipefail
          installer=.chezmoiscripts/run_onchange_after_40_linux_mise.sh.tmpl
          # Match the literal shell parameter expansion.
          # shellcheck disable=SC2016
          version="$(sed -n 's/^readonly MISE_VERSION="${MISE_VERSION:-\([^}]*\)}"$/\1/p' "$installer")"
          checksums="$(curl --compressed -fsSL \
            "https://github.com/jdx/mise/releases/download/v${version}/SHASUMS256.txt")"
          x64_checksum="$(awk -v name="./mise-v${version}-linux-x64" \
            '$2 == name { print $1 }' <<<"$checksums")"
          arm64_checksum="$(awk -v name="./mise-v${version}-linux-arm64" \
            '$2 == name { print $1 }' <<<"$checksums")"
          [[ "$x64_checksum" =~ ^[0-9a-f]{64}$ ]]
          [[ "$arm64_checksum" =~ ^[0-9a-f]{64}$ ]]
          sed -i \
            "/x86_64)/,/;;/ s/readonly MISE_SHA256=\"[0-9a-f]*\"/readonly MISE_SHA256=\"${x64_checksum}\"/" \
            "$installer"
          sed -i \
            "/aarch64 | arm64)/,/;;/ s/readonly MISE_SHA256=\"[0-9a-f]*\"/readonly MISE_SHA256=\"${arm64_checksum}\"/" \
            "$installer"

      - name: Install the repository-pinned mise
        shell: bash
        run: |
          set -euo pipefail
          installer=.chezmoiscripts/run_onchange_after_40_linux_mise.sh.tmpl
          # Match the literal shell parameter expansion.
          # shellcheck disable=SC2016
          version="$(sed -n 's/^readonly MISE_VERSION="${MISE_VERSION:-\([^}]*\)}"$/\1/p' "$installer")"
          checksum="$(awk '
            /x86_64\)/ { x64 = 1 }
            x64 && /readonly MISE_SHA256=/ {
              value = $0
              sub(/^.*MISE_SHA256="/, "", value)
              sub(/"$/, "", value)
              print value
              exit
            }
          ' "$installer")"
          test -n "$version"
          test -n "$checksum"
          curl -fsSL \
            "https://github.com/jdx/mise/releases/download/v${version}/mise-v${version}-linux-x64" \
            -o "$RUNNER_TEMP/mise"
          echo "$checksum  $RUNNER_TEMP/mise" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/mise"

      - name: Refresh the Linux lock entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CONFIG_FILE: ${{ github.workspace }}/dot_config/mise/config.toml
          MISE_SAFE: "1"
        run: >-
          "$RUNNER_TEMP/mise" lock --global --bump
          --platform linux-x64,linux-arm64

      - name: Verify every configured tool remains locked
        shell: bash
        run: |
          set -euo pipefail
          config_tools="$(mktemp)"
          locked_tools="$(mktemp)"
          awk -F'"' '/^".*" = / { print $2 }' \
            dot_config/mise/config.toml | sort >"$config_tools"
          sed -n 's/^\[\[tools\."\(.*\)"\]\]$/\1/p' \
            dot_config/mise/mise.lock | sort >"$locked_tools"
          missing="$(comm -23 "$config_tools" "$locked_tools")"
          if [[ -n "$missing" ]]; then
            echo "Lock refresh omitted configured tools:" >&2
            echo "$missing" >&2
            exit 1
          fi

      - name: Commit the refreshed mise data
        shell: bash
        run: |
          set -euo pipefail
          installer=.chezmoiscripts/run_onchange_after_40_linux_mise.sh.tmpl
          lockfile=dot_config/mise/mise.lock
          if git diff --quiet -- "$installer" "$lockfile"; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$installer" "$lockfile"
          git commit -m "chore: refresh mise generated data"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
