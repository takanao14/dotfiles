name: Refresh mise lockfile

on:
  pull_request:
    paths:
      - dot_config/mise/config.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the update branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install the repository-pinned mise
        shell: bash
        run: |
          set -euo pipefail
          installer=.chezmoiscripts/run_onchange_after_linux1_mise.sh.tmpl
          version="$(sed -n 's/^readonly MISE_VERSION="${MISE_VERSION:-\([^}]*\)}"$/\1/p' "$installer")"
          checksum="$(awk '
            /x86_64\)/ { x64 = 1 }
            x64 && /readonly MISE_SHA256=/ {
              value = $0
              sub(/^.*MISE_SHA256="/, "", value)
              sub(/"$/, "", value)
              print value
              exit
            }
          ' "$installer")"
          test -n "$version"
          test -n "$checksum"
          curl -fsSL \
            "https://github.com/jdx/mise/releases/download/v${version}/mise-v${version}-linux-x64" \
            -o "$RUNNER_TEMP/mise"
          echo "$checksum  $RUNNER_TEMP/mise" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/mise"

      - name: Refresh the Linux lock entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CONFIG_FILE: ${{ github.workspace }}/dot_config/mise/config.toml
          MISE_SAFE: "1"
        run: >-
          "$RUNNER_TEMP/mise" lock --global --bump
          --platform linux-x64,linux-arm64

      - name: Commit the refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dot_config/mise/mise.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dot_config/mise/mise.lock
          git commit -m "chore: refresh mise lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
